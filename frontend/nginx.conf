server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Qualquer requisição para o Nginx que não for um arquivo real,
    # ele redireciona para o index.html. Isso é crucial para o Roteamento do Angular (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para o Backend Java
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy para as fotos de perfil (o ^~ impede que a regra de ficheiros estáticos abaixo roube o pedido)
    location ^~ /uploads/ {
        proxy_pass http://api-gateway:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache opcional para arquivos estáticos (melhora performance)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
