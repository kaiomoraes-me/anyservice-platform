<div class="auth-wrapper">
  <div class="glass-container">
    <div class="auth-header">
      <h1>Recuperar Senha</h1>
      <p>Digite seu e-mail para receber um código de recuperação.</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <div class="input-group" [class.has-error]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" placeholder="seu@email.com">
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        @if(isLoading) {
          <span class="spinner"></span> Enviando...
        } @else {
          Enviar Código
        }
      </button>

      <div class="auth-links">
        <p>Lembrou a senha? <a routerLink="/login">Voltar ao Login</a></p>
      </div>
    </form>
  </div>
</div>
