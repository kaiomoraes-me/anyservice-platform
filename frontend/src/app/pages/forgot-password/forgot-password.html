<div class="page-container fade-in centered-layout">
  <div class="glass-panel auth-panel">
    <div class="auth-header">
      <div class="logo-mark auth-logo"></div>
      <h1>Recuperar Senha</h1>
      <p>Digite seu e-mail para receber um código de recuperação.</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <div class="input-group" [class.has-error]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
        <label for="email" style="color:var(--color-text-secondary); font-size:var(--text-sm); font-weight:500;">E-mail</label>
        <input type="email" class="minimal-input" id="email" formControlName="email" placeholder="seu@email.com">
      </div>

      <button type="submit" class="btn-premium" style="width:100%; justify-content:center; margin-top:var(--space-sm);" [disabled]="isLoading">
        @if(isLoading) {
          <span class="spinner" style="display:inline-block; width:18px; height:18px; border:2px solid var(--color-border); border-top-color:var(--color-text-primary); border-radius:50%; animation:spin 0.8s linear infinite;"></span> Enviando...
        } @else {
          Enviar Código
        }
      </button>

      <div class="auth-links" style="text-align:center; margin-top:var(--space-md); color:var(--color-text-secondary); font-size:var(--text-sm);">
        <p>Lembrou a senha? <a routerLink="/login" style="color:var(--color-text-primary); font-weight:600;">Voltar ao Login</a></p>
      </div>
    </form>
  </div>
</div>
