<div class="page-container fade-in centered-layout">
  <div class="glass-panel auth-panel">
    <div class="login-header">
      <div class="logo-mark auth-logo"></div>
      <h1>AnyService</h1>
      <p>Bem-vindo de volta! Faça login na sua conta.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      @if(errorMessage) {
        <div class="error-banner">
          {{ errorMessage }}
        </div>
      }

      <div class="input-group" [class.has-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <label for="email">E-mail</label>
        <input type="email" class="minimal-input" id="email" formControlName="email" placeholder="nome@email.com">
      </div>

      <div class="input-group" [class.has-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <label for="password">Senha</label>
        <input type="password" class="minimal-input" id="password" formControlName="password" placeholder="••••••••">
      </div>

      <div class="actions">
        <a routerLink="/forgot-password" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-premium btn-block" [disabled]="isLoading">
        @if(isLoading) {
          <span class="spinner"></span> Entrando...
        } @else {
          Entrar
        }
      </button>

      <div class="register-prompt">
        Não tem uma conta? <a routerLink="/register">Registre-se agora</a>
      </div>
    </form>
  </div>
</div>
