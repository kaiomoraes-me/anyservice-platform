<div class="page-container fade-in centered-layout">
  <div class="glass-panel auth-panel">
    <div class="auth-header">
      <div class="logo-mark auth-logo"></div>
      <h1>Redefinir Senha</h1>
      <p>Digite o código enviado para <strong>{{ email }}</strong> e a nova senha.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <div class="input-group" [class.has-error]="resetForm.get('code')?.invalid && resetForm.get('code')?.touched">
        <label for="code" style="color:var(--color-text-secondary); font-size:var(--text-sm); font-weight:500;">Código de Verificação</label>
        <input type="text" class="minimal-input text-center text-tracking" id="code" formControlName="code" placeholder="000000" maxlength="6">
      </div>

      <div class="input-group" [class.has-error]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
        <label for="newPassword" style="color:var(--color-text-secondary); font-size:var(--text-sm); font-weight:500;">Nova Senha</label>
        <input type="password" class="minimal-input" id="newPassword" formControlName="newPassword" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="input-group" [class.has-error]="(resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched) || (resetForm.hasError('passwordsMismatch') && resetForm.get('confirmPassword')?.touched)">
        <label for="confirmPassword" style="color:var(--color-text-secondary); font-size:var(--text-sm); font-weight:500;">Confirmar Nova Senha</label>
        <input type="password" class="minimal-input" id="confirmPassword" formControlName="confirmPassword" placeholder="Repita a nova senha">
        @if(resetForm.hasError('passwordsMismatch') && resetForm.get('confirmPassword')?.touched) {
          <span class="field-error-text" style="color: #ef4444; font-size: var(--text-xs); margin-top: 4px;">As senhas não coincidem.</span>
        }
      </div>

      <button type="submit" class="btn-premium" style="width:100%; justify-content:center; margin-top:var(--space-sm);" [disabled]="isLoading">
        @if(isLoading) {
          <span class="spinner" style="display:inline-block; width:18px; height:18px; border:2px solid var(--color-border); border-top-color:var(--color-text-primary); border-radius:50%; animation:spin 0.8s linear infinite;"></span> Salvando...
        } @else {
          Salvar Nova Senha
        }
      </button>

      <div class="auth-links" style="text-align:center; margin-top:var(--space-md); color:var(--color-text-secondary); font-size:var(--text-sm);">
        <p><a routerLink="/login" style="color:var(--color-text-primary); font-weight:600;">Voltar ao Login</a></p>
      </div>
    </form>
  </div>
</div>
