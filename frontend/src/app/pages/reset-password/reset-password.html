<div class="auth-wrapper">
  <div class="glass-container">
    <div class="auth-header">
      <h1>Redefinir Senha</h1>
      <p>Digite o código enviado para <strong>{{ email }}</strong> e a nova senha.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <div class="input-group" [class.has-error]="resetForm.get('code')?.invalid && resetForm.get('code')?.touched">
        <label for="code">Código de Verificação</label>
        <input type="text" id="code" formControlName="code" placeholder="000000" maxlength="6" class="text-center text-tracking">
      </div>

      <div class="input-group" [class.has-error]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
        <label for="newPassword">Nova Senha</label>
        <input type="password" id="newPassword" formControlName="newPassword" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="input-group" [class.has-error]="(resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched) || (resetForm.hasError('passwordsMismatch') && resetForm.get('confirmPassword')?.touched)">
        <label for="confirmPassword">Confirmar Nova Senha</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Repita a nova senha">
        @if(resetForm.hasError('passwordsMismatch') && resetForm.get('confirmPassword')?.touched) {
          <span class="field-error-text">As senhas não coincidem.</span>
        }
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        @if(isLoading) {
          <span class="spinner"></span> Salvando...
        } @else {
          Salvar Nova Senha
        }
      </button>

      <div class="auth-links">
        <p><a routerLink="/login">Voltar ao Login</a></p>
      </div>
    </form>
  </div>
</div>
