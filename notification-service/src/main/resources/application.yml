server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:catalog_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:user}
    password: ${RABBITMQ_PASSWORD:password}

jwt:
  secret: ${JWT_SECRET:8f8373b5c8793b827e8d38706d8a39a066ff059914757fc2580df14589d71c4c}
  expiration: 86400000 # 1 day

vonage:
  api:
    key: ${VONAGE_API_KEY:}
    secret: ${VONAGE_API_SECRET:}
