name: AnyService CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - api-gateway
          - user-service
          - catalog-service
          - order-service
          - chat-service
          - notification-service
      fail-fast: false # Se um falhar, continua compilando os outros para ver quais têm erros
    defaults:
      run:
        working-directory: ./${{ matrix.service }}

    steps:
    - name: Check out the code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        # Dá permissão caso exista o script (nós vamos usar o mvn do próprio ubuntu se não existir)
        chmod +x mvnw || true
        mvn clean package -DskipTests
      
    # Se tivéssemos testes configurados, rodaríamos sem o -DskipTests:
    # - name: Run Tests
    #   run: mvn test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Check out the code
      uses: actions/checkout@v3

    - name: Set up Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build Angular Project
      run: npm run build

  deploy:
    name: Deploy to AWS
    needs: [backend-build, frontend-build]
    # Só faz deploy se a alteração for direto na branch 'main' (impede deploy acidental em Pull Requests)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos no servidor da AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          command_timeout: 20m
          script: |
            cd anyservice-platform
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose up --build -d
            sudo docker system prune -f
