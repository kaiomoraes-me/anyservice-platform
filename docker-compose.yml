version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: anyservice_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-anyservice_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - anyservice_net

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: anyservice_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - anyservice_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anyservice_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - anyservice_net

networks:
  anyservice_net:
    driver: bridge

volumes:
  postgres_data:
